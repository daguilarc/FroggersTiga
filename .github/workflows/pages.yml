name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Label authority checks
        run: |
          chmod +x sim/check_param_display_names.sh sim/check_mod_source_labels.sh sim/check_operator_docs_sync.sh sim/check_vcv_panel_bounds.sh sim/check_vcv_panel_svg.sh
          sim/check_param_display_names.sh
          sim/check_mod_source_labels.sh
          sim/check_operator_docs_sync.sh
          sim/check_vcv_panel_bounds.sh
          sim/check_vcv_panel_svg.sh

      - name: Setup emsdk
        uses: emscripten-core/setup-emsdk@v16

      - name: Build WASM
        run: |
          cd wasm
          emcmake cmake -B build
          cmake --build build
          cp build/froggers.wasm ../web/public/froggers.wasm

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build web
        run: |
          cd web
          npm install
          VITE_BASE=/FroggersTiga/ npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
