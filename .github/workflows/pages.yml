name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Preflight checks
        run: |
          chmod +x desktop/scripts/verify-release-metadata.sh desktop/scripts/verify-tag-version_test.sh scripts/check_host_artifact_hygiene.sh scripts/check_openspec_hygiene.sh sim/check_host_display_projections.sh sim/check_mod_source_labels.sh sim/check_operator_docs_sync.sh sim/check_vcv_panel_bounds.sh sim/check_vcv_panel_svg.sh
          scripts/check_host_artifact_hygiene.sh
          if command -v openspec >/dev/null 2>&1; then
            scripts/check_openspec_hygiene.sh
          else
            echo "SKIP: openspec CLI not installed; run scripts/check_openspec_hygiene.sh locally before OpenSpec closure"
          fi
          desktop/scripts/verify-release-metadata.sh
          node scripts/generate-host-display.mjs --check
          node scripts/verify-host-display-shape.mjs
          sim/check_host_display_projections.sh
          sim/check_mod_source_labels.sh
          sim/check_operator_docs_sync.sh
          sim/check_vcv_panel_bounds.sh
          sim/check_vcv_panel_svg.sh
          sim/check_vcv_midi_boundary.sh
          sim/check_vcv_license_boundary.sh

      - name: Setup emsdk
        uses: emscripten-core/setup-emsdk@v16

      - name: Build WASM
        run: |
          cd wasm
          emcmake cmake -B build
          cmake --build build
          cp build/froggers.wasm ../web/public/froggers.wasm

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build web
        run: |
          cd web
          npm ci
          VITE_BASE=/FroggersTiga/ npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
