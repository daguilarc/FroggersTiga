name: Firmware tests

on:
  push:
    paths:
      - 'src/core/**'
      - 'test/firmware/**'
      - 'Makefile'
      - '.github/workflows/firmware-tests.yml'
  pull_request:
    paths:
      - 'src/core/**'
      - 'test/firmware/**'
      - 'Makefile'
      - '.github/workflows/firmware-tests.yml'

jobs:
  firmware-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Run firmware tests
        run: make firmware-test
