name: Desktop Release

on:
  push:
    tags:
      - 'froggerstiga-v*'

permissions:
  contents: write

jobs:
  build-macos:
    if: github.ref_name == 'froggerstiga-v1'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Verify release channel tag
        run: ./desktop/scripts/verify-tag-version.sh "${{ github.ref_name }}"

      - name: Verify release metadata
        run: ./desktop/scripts/verify-release-metadata.sh

      - name: Configure and build Release
        run: |
          cd desktop
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release

      - name: Package DMG
        run: ./desktop/scripts/package-macos.sh

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: desktop/dist/FroggersTiga.dmg
          if-no-files-found: error

  build-windows:
    if: github.ref_name == 'froggerstiga-v1'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify release channel tag
        shell: bash
        run: ./desktop/scripts/verify-tag-version.sh "${{ github.ref_name }}"

      - name: Verify release metadata
        shell: bash
        run: ./desktop/scripts/verify-release-metadata.sh

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Configure and build Release
        run: |
          cd desktop
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release

      - name: Package Windows installer
        shell: pwsh
        run: ./desktop/scripts/package-windows.ps1

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-setup
          path: desktop/dist/FroggersTiga-Setup.exe
          if-no-files-found: error

  release:
    if: github.ref_name == 'froggerstiga-v1'
    runs-on: ubuntu-latest
    needs: [build-macos, build-windows]
    steps:
      - uses: actions/checkout@v4

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: macos-dmg
          path: dist

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-setup
          path: dist

      - name: Read package version
        id: ver
        run: echo "version=$(./desktop/scripts/read-version.sh)" >> "$GITHUB_OUTPUT"

      - name: Render release notes from SIM_MANUAL.md
        run: ./desktop/scripts/render-release-notes.sh "${{ github.ref_name }}" > release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Desktop ${{ github.ref_name }} · v${{ steps.ver.outputs.version }}
          body_path: release-notes.md
          files: dist/*
